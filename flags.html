<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grid_flags/flags.css">
    <title>Flag</title>
</head>
<nav>
    <a href=index.html id="backButton">Back</a>
</nav>
<body>
    <header>
        <h1>Using CSS Grid to make Country Flags</h1>
    </header>
    <main>
        <h2>Chile</h2>
        <div id="chile">
            <div id="blue">
                <div class="star"></div>
            </div>
            <div id="white"></div>
            <div id="red"></div>
        </div>
        <hr>

        <h2>Denmark</h2>
        <div id="denmark">
            <div id="dred1"></div>
            <div id="dred2"></div>
            <div id="dred3"></div>
            <div id="dred4"></div>
        </div>
        <hr>

        <h2>Finland</h2>
        <div id="finland">
            <div id="fwhite1"></div>
            <div id="fwhite2"></div>
            <div id="fwhite3"></div>
            <div id="fwhite4"></div>
        </div>
        <hr>

        <h2>Benin</h2>
        <div id="benin">
            <div id="bgreen"></div>
            <div id="byellow"></div>
            <div id="bred"></div>
        </div>

        <hr>

        <h2>Ciegelandia</h2>
        <div id="ciegelandia">
            <div id="cgreen" class="triangle">
                <img src="grid_flags/images/42-WaterMark.png" alt="42-WaterMark.png" id="logo">
            </div>
            <div id="corange"></div>
            <div id="cmaroon"></div>
        </div>
        <hr>
    </main>
</body>

</html>
